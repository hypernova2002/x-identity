      - BearerAuth: []
      responses:
        '200':
          description: identity providers, without their secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/IdentityProvider"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    post:
      summary: Add an identity provider
      tags:
      - Identity providers
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                additional_audiences:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                  maxItems: 10
                allow_idp_initiated:
                  anyOf:
                  - type: boolean
                apple_key_id:
                  type: string
                  minLength: 10
                  maxLength: 10
                apple_private_key:
                  type: string
                  minLength: 1
                  maxLength: 4000
                apple_team_id:
                  type: string
                  minLength: 10
                  maxLength: 10
                client_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                client_secret:
                  type: string
                  minLength: 1
                  maxLength: 1000
                create_users:
                  anyOf:
                  - type: boolean
                discovery_url:
                  type: string
                  minLength: 1
                  maxLength: 2048
                domains:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 253
                  maxItems: 50
                enabled:
                  anyOf:
                  - type: boolean
                group_mappings:
                  type: array
                  items:
                    properties:
                      group_uid:
                        type: string
                        minLength: 1
                        maxLength: 64
                      value:
                        type: string
                        minLength: 1
                        maxLength: 255
                    type: object
                    unevaluatedProperties: false
                    required:
                    - group_uid
                    - value
                    additionalProperties: false
                  maxItems: 100
                kind:
                  enum:
                  - google
                  - apple
                  - oidc
                  - saml
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                saml_email_attribute:
                  anyOf:
                  - type: 'null'
                  - type: string
                    maxLength: 255
                saml_groups_attribute:
                  anyOf:
                  - type: 'null'
                  - type: string
                    maxLength: 255
                saml_idp_certificates:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 10000
                  maxItems: 5
                saml_idp_entity_id:
                  type: string
                  minLength: 1
                  maxLength: 1024
                saml_name_attribute:
                  anyOf:
                  - type: 'null'
                  - type: string
                    maxLength: 255
                saml_name_id_format:
                  enum:
                  - email
                  - persistent
                  - unspecified
                saml_slo_url:
                  anyOf:
                  - type: 'null'
                  - type: string
                    maxLength: 2048
                saml_sso_url:
                  type: string
                  minLength: 1
                  maxLength: 2048
                scopes:
                  type: string
                  minLength: 1
                  maxLength: 500
              type: object
              unevaluatedProperties: false
              required:
              - kind
              - name
              additionalProperties: false
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IdentityProvider"
        '403':
          description: only project admins can manage identity providers
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: invalid settings, or the discovery document couldn't be loaded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
