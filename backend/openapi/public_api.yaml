      - name: q
        in: query
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            search:
              type: string
              description: Name
            kind_eq:
              type: string
            kind_in:
              type: array
              items:
                type: string
            enabled_eq:
              type: string
              enum:
              - 'true'
              - 'false'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - "-name"
          - kind
          - "-kind"
          - created_at
          - "-created_at"
        description: "`-` sorts descending."
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
        description: Values above 100 are capped.
