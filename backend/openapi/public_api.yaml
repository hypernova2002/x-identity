servers:
- url: "/"
components:
  schemas:
    Account:
      type: object
      required:
      - uid
      - name
      - slug
      - created_at
      - updated_at
      properties:
        uid:
          type: string
          example: acct_7Hq2Xf9kLmN3pR8sT4vW6yZa
        name:
          type: string
        slug:
          type: string
          description: Account alias used in sign-in URLs.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      title: Account
    ApiGrant:
      type: object
      required:
      - uid
      - api_uid
      - api_name
      - api_identifier
      - scopes
      - created_at
      - updated_at
      properties:
        uid:
          type: string
        api_uid:
          type: string
        api_name:
          type: string
        api_identifier:
          type: string
        scopes:
          type: array
          items:
            type: string
          description: What the app may request in tokens for the API.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      title: ApiGrant
    ApiResource:
      type: object
      required:
      - uid
      - name
      - identifier
      - scopes
      - access_token_ttl_seconds
      - app_count
      - created_at
      - updated_at
      properties:
        uid:
          type: string
          example: api_8Hd2Lq6Wm3Xc9Vb5Nz7Rt4Kj
        name:
          type: string
        identifier:
          type: string
          description: The `aud` of access tokens for this API.
        scopes:
          type: array
          items:
            type: object
            required:
            - name
            - description
            properties:
              name:
                type: string
              description:
                type:
                - string
                - 'null'
        access_token_ttl_seconds:
          type:
          - integer
          - 'null'
          description: Null uses the project's access token lifetime.
        app_count:
          type: integer
          description: Machine-to-machine apps with access.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      title: ApiResource
    AppAssignment:
      type: object
      required:
      - uid
      - principal_type
      - principal_uid
      - principal_label
      - created_at
      properties:
        uid:
          type: string
          example: asg_2Wq7Lm4Xc9Vb3Nz8Rt5Kj6Hd
        principal_type:
          type: string
          enum:
          - end_user
          - group
        principal_uid:
          type: string
        principal_label:
          type: string
          description: The group's name or the end user's email.
        created_at:
          type: string
          format: date-time
      title: AppAssignment
    AppClient:
      type: object
      required:
      - uid
      - name
      - client_type
      - machine
      - token_requests_per_minute
      - allowed_origins
      - redirect_uris
      - post_logout_redirect_uris
      - launch_url
      - enabled
      - created_at
      - updated_at
      properties:
        uid:
          type: string
          example: cl_4Kd8Wq2LmP7xR5tN9vB3cZ6h
          description: Sent as `client_id` by the app.
        name:
          type: string
        client_type:
          type: string
          enum:
          - public
          - confidential
        machine:
          type: boolean
          description: A machine-to-machine app, which gets tokens for APIs with the
            client_credentials grant.
        allowed_origins:
          type: array
          items:
            type: string
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        launch_url:
          type:
          - string
          - 'null'
          description: Where the app portal opens the app.
        enabled:
          type: boolean
        token_requests_per_minute:
