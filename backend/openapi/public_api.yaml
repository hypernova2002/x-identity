    Error:
      type: object
      description: |-
        Standard error response. Codes and their HTTP statuses:

        - `bad_request` (400): The request could not be understood.
        - `unauthorized` (401): Authentication is required.
        - `invalid_credentials` (401): The email or password is incorrect.
        - `invalid_token` (401): The token is invalid or has expired.
        - `session_expired` (401): Your session has expired. Sign in again.
        - `mfa_required` (401): Multi-factor authentication is required. Sign in again to continue.
        - `invalid_challenge` (401): The sign-in session is invalid or has expired. Start signing in again.
        - `invalid_otp` (401): The verification code is incorrect.
        - `invalid_client` (401): The app client is unknown, disabled, or its secret is wrong.
        - `invalid_code` (400): The code is incorrect or has expired. Request a new one.
        - `invalid_redirect_uri` (400): The redirect URI isn't registered for this app client.
        - `invalid_state` (400): The sign-in request is unknown or has expired. Start signing in again.
        - `invalid_interaction` (400): This sign-in has expired. Go back to the app and try again.
        - `invalid_id_token` (401): The identity provider's token is invalid or has expired.
        - `invalid_saml_response` (401): The sign-in response from the identity provider couldn't be verified.
        - `forbidden` (403): You do not have permission to perform this action.
        - `email_not_verified` (403): Verify your email address before signing in.
        - `mfa_required_by_policy` (403): Multi-factor authentication is required by your account's policy and can't be turned off.
        - `user_disabled` (403): Too many failed verification attempts. This account has been disabled; ask an administrator to re-enable it.
        - `sign_up_disabled` (403): Self sign-up is turned off for this project.
        - `app_access_denied` (403): You don't have access to this app. Ask an administrator to give you access.
        - `provider_email_unverified` (403): Your email address isn't verified with this identity provider.
        - `not_found` (404): The requested resource could not be found.
        - `method_not_allowed` (405): The request method is not supported for this resource.
        - `not_acceptable` (406): The requested response format is not supported.
        - `conflict` (409): The request conflicts with the current state of the resource.
        - `email_taken` (409): A user with this email address already exists in this account.
        - `mfa_already_enabled` (409): Multi-factor authentication is already turned on.
        - `last_owner` (409): An account must keep at least one active owner.
        - `identity_conflict` (409): This user is already linked to a different account at this identity provider.
        - `last_sign_in_method` (409): This is the user's only way to sign in, so it can't be removed.
        - `validation_failed` (422): One or more fields are invalid.
        - `too_many_attempts` (429): Too many failed attempts. Try again later.
        - `rate_limited` (429): Too many requests. Try again later.
        - `internal_error` (500): An unexpected error occurred.
        - `identity_provider_error` (502): The identity provider couldn't complete the sign-in. Try again.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              enum:
              - bad_request
              - unauthorized
              - invalid_credentials
              - invalid_token
              - session_expired
              - mfa_required
              - invalid_challenge
              - invalid_otp
              - invalid_client
              - invalid_code
              - invalid_redirect_uri
              - invalid_state
              - invalid_interaction
              - invalid_id_token
              - invalid_saml_response
              - forbidden
              - email_not_verified
              - mfa_required_by_policy
              - user_disabled
              - sign_up_disabled
              - app_access_denied
              - provider_email_unverified
              - not_found
              - method_not_allowed
              - not_acceptable
              - conflict
              - email_taken
              - mfa_already_enabled
              - last_owner
              - identity_conflict
              - last_sign_in_method
              - validation_failed
              - too_many_attempts
              - rate_limited
              - internal_error
              - identity_provider_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                - field
                - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
      title: Error
