      in: path
      required: true
      schema:
        type: string
    - name: project_uid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List and search the project's end users
      tags:
      - End users
      parameters:
      - name: q
        in: query
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            search:
              type: string
              description: Email, name or uid
            status_eq:
              type: string
            uid_eq:
              type: string
            with_verified_email:
              type: string
              enum:
              - 'true'
              - 'false'
            with_mfa:
              type: string
              enum:
              - 'true'
              - 'false'
            invitation_pending:
              type: string
              enum:
              - 'true'
            in_group:
              type: string
              description: Group uid
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - email
          - "-email"
          - name
          - "-name"
          - status
          - "-status"
          - created_at
          - "-created_at"
          - last_sign_in_at
          - "-last_sign_in_at"
        description: "`-` sorts descending."
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
        description: Values above 100 are capped.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: end users, paginated with Total, Per-Page and Link headers
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/EndUser"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    post:
      summary: Create an end user and invite them to set a password
      tags:
      - End users
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                custom_attributes:
                  type: object
                email:
                  type: string
                  format: email
                name:
                  anyOf:
                  - type: 'null'
                  - type: string
                    minLength: 1
                    maxLength: 100
                send_invitation:
                  anyOf:
                  - type: boolean
              type: object
              unevaluatedProperties: false
              required:
              - email
              additionalProperties: false
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EndUser"
        '403':
          description: only project admins and developers can manage end users
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
