---
openapi: 3.1.0
info:
  title: x-identity API
  version: v1
paths:
  "/v1/account-lookup/{slug}":
    parameters:
    - name: slug
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Find an account by its alias
      tags:
      - Sign in
      responses:
        '200':
          description: account found
          content:
            application/json:
              schema:
                type: object
                required:
                - uid
                - name
                - slug
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
        '404':
          description: no account with this alias
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/.well-known/jwks.json":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Public keys for verifying the account's access tokens
      tags:
      - Sign in
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                required:
                - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/audit-events":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List the account's audit events, newest first
      tags:
      - Audit log
      parameters:
      - name: q
        in: query
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            search:
              type: string
              description: Action prefix, e.g. `end_user.`
            action_eq:
              type: string
            action_start:
              type: string
            actor_uid_eq:
              type: string
            target_uid_eq:
              type: string
            app_client_uid_eq:
              type: string
            saml_app_uid_eq:
              type: string
            occurred_at_gteq:
              type: string
              format: date-time
            occurred_at_lteq:
              type: string
              format: date-time
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - occurred_at
          - "-occurred_at"
        description: "`-` sorts descending."
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
        description: Values above 100 are capped.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/AuditEvent"
        '403':
          description: only account owners and admins can read the audit log
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth-configuration":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: The account's authentication settings
      tags:
      - Auth configuration
      security:
      - BearerAuth: []
      responses:
        '200':
          description: current settings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthConfiguration"
        '403':
          description: only account owners and admins can see settings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    put:
      summary: Update the account's authentication settings
      tags:
      - Auth configuration
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                access_token_ttl_seconds:
                  type: integer
                  minimum: 300
                  maximum: 3600
                client_secret_rotation_overlap_seconds:
                  type: integer
                  minimum: 0
                  maximum: 2592000
                email_code_failure_window_seconds:
                  type: integer
                  minimum: 300
                  maximum: 86400
                email_code_max_attempts:
                  type: integer
                  minimum: 3
                  maximum: 10
                email_code_max_failures_per_code:
                  type: integer
                  minimum: 2
                  maximum: 100
                email_code_max_failures_per_email:
                  type: integer
                  minimum: 3
                  maximum: 100
                lockout_duration_seconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                lockout_threshold:
                  type: integer
                  minimum: 3
                  maximum: 100
                lockout_window_seconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                mfa_max_failed_attempts:
                  type: integer
                  minimum: 3
                  maximum: 20
                mfa_requirement:
                  enum:
                  - 'off'
                  - optional
                  - required
                notify_new_devices:
                  anyOf:
                  - type: boolean
                otp_digits:
                  type: integer
                  minimum: 6
                  maximum: 10
                otp_drift_steps:
                  type: integer
                  minimum: 0
                  maximum: 2
                otp_hotp_look_ahead:
                  type: integer
                  minimum: 1
                  maximum: 20
                otp_method:
                  enum:
                  - totp
                  - hotp
                otp_step_seconds:
                  type: integer
                  minimum: 30
                  maximum: 900
                password_max_age_seconds:
                  anyOf:
                  - type: 'null'
                  - type: integer
                    minimum: 86400
                    maximum: 31536000
                password_min_length:
                  type: integer
                  minimum: 8
                  maximum: 128
                password_require_lowercase:
                  anyOf:
                  - type: boolean
                password_require_number:
                  anyOf:
                  - type: boolean
                password_require_symbol:
                  anyOf:
                  - type: boolean
                password_require_uppercase:
                  anyOf:
                  - type: boolean
                refresh_token_ttl_seconds:
                  type: integer
                  minimum: 86400
                  maximum: 31536000
                require_email_verification:
                  anyOf:
                  - type: boolean
                session_idle_timeout_seconds:
                  anyOf:
                  - type: 'null'
                  - type: integer
                    minimum: 300
                    maximum: 2592000
                signing_algorithm:
                  enum:
                  - ES256
                  - RS256
                  - PS256
                signing_key_rotation_seconds:
                  type: integer
                  minimum: 2592000
                  maximum: 31536000
                sso_session_ttl_seconds:
                  type: integer
                  minimum: 300
                  maximum: 2592000
                token_requests_per_minute:
                  type: integer
                  minimum: 10
                  maximum: 10000
              type: object
              unevaluatedProperties: false
              additionalProperties: false
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthConfiguration"
        '422':
          description: a setting is out of range
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/accept-invitation":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Accept an invitation and create your user
      tags:
      - Invitations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
              type: object
              unevaluatedProperties: false
              required:
              - name
              - password
              - token
              additionalProperties: false
      responses:
        '201':
          description: user created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: invalid, expired or revoked invitation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: invalid name or password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/confirm-email":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Confirm an email address
      tags:
      - Email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
              type: object
              unevaluatedProperties: false
              required:
              - token
              additionalProperties: false
      responses:
        '204':
          description: email verified
        '401':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/confirm-email-change":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Confirm a new email address
      tags:
      - Me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
              type: object
              unevaluatedProperties: false
              required:
              - token
              additionalProperties: false
      responses:
        '204':
          description: email changed; all sessions signed out
        '401':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: email taken since the change was requested
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/forgot-password":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Email a password reset link
      tags:
      - Password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 254
              type: object
              unevaluatedProperties: false
              required:
              - email
              additionalProperties: false
      responses:
        '202':
          description: accepted, whether or not the email exists
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/mfa-setup":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Get a TOTP secret while answering an mfa_setup challenge
      tags:
      - Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                session:
                  type: string
                  minLength: 1
                  maxLength: 256
              type: object
              unevaluatedProperties: false
              required:
              - session
              additionalProperties: false
      responses:
        '200':
          description: secret and QR code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MfaEnrollment"
        '401':
          description: invalid session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/refresh":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Exchange a refresh token for new tokens
      tags:
      - Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  type: string
                  minLength: 1
                  maxLength: 256
              type: object
              unevaluatedProperties: false
              required:
              - refresh_token
              additionalProperties: false
      responses:
        '200':
          description: new tokens
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenSet"
        '401':
          description: invalid, reused or expired refresh token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/resend-confirmation":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Resend the verification email
      tags:
      - Email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 254
              type: object
              unevaluatedProperties: false
              required:
              - email
              additionalProperties: false
      responses:
        '202':
          description: accepted, whether or not the email exists
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/reset-password":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Set a new password with a reset token
      tags:
      - Password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                token:
                  type: string
                  minLength: 1
                  maxLength: 256
              type: object
              unevaluatedProperties: false
              required:
              - password
              - token
              additionalProperties: false
      responses:
        '204':
          description: password changed
        '401':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: password breaks the account's rules
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/respond-to-challenge":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Answer a sign-in challenge
      tags:
      - Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                challenge:
                  enum:
                  - otp
                  - new_password
                  - mfa_setup
                code:
                  type: string
                  minLength: 1
                  maxLength: 32
                new_password:
                  type: string
                  minLength: 1
                  maxLength: 128
                session:
                  type: string
                  minLength: 1
                  maxLength: 256
              type: object
              unevaluatedProperties: false
              required:
              - challenge
              - session
              additionalProperties: false
      responses:
        '200':
          description: tokens, or the next challenge
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SignInResult"
        '401':
          description: wrong code or invalid session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: invalid new password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: user disabled after too many wrong codes in a row
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: locked out after too many failures
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/sign-in":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Sign in with email and password
      tags:
      - Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              type: object
              unevaluatedProperties: false
              required:
              - email
              - password
              additionalProperties: false
      responses:
        '200':
          description: tokens, or a challenge to answer
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SignInResult"
        '401':
          description: wrong email or password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '403':
          description: email not verified
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: unknown account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '429':
          description: locked out after too many failures
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/auth/sign-out":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Revoke the session behind a refresh token
      tags:
      - Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  type: string
                  minLength: 1
                  maxLength: 256
              type: object
              unevaluatedProperties: false
              required:
              - refresh_token
              additionalProperties: false
      responses:
        '204':
          description: signed out
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/invitations":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: List pending invitations
      tags:
      - Invitations
      parameters:
      - name: q
        in: query
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            search:
              type: string
              description: Email
            role_eq:
              type: string
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - email
          - "-email"
          - role
          - "-role"
          - expires_at
          - "-expires_at"
          - created_at
          - "-created_at"
        description: "`-` sorts descending."
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
        description: Values above 100 are capped.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Invitation"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    post:
      summary: Invite someone to the account
      tags:
      - Invitations
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                  format: email
                role:
                  enum:
                  - owner
                  - admin
                  - member
              type: object
              unevaluatedProperties: false
              required:
              - email
              - role
              additionalProperties: false
      responses:
        '201':
          description: invitation sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Invitation"
        '403':
          description: not allowed to invite with this role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: a user with this email already exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/me":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: The signed-in user and their account
      tags:
      - Me
      security:
      - BearerAuth: []
      responses:
        '200':
          description: the signed-in user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '401':
          description: missing, invalid or revoked access token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    patch:
      summary: Update your profile
      tags:
      - Me
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
              type: object
              unevaluatedProperties: false
              additionalProperties: false
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        '422':
          description: invalid name
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/me/email":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Request an email change
      tags:
      - Me
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 128
                new_email:
                  type: string
                  format: email
                otp_code:
                  type: string
                  minLength: 1
                  maxLength: 32
              type: object
              unevaluatedProperties: false
              required:
              - current_password
              - new_email
              additionalProperties: false
      responses:
        '202':
          description: accepted; a confirmation is sent to the new address if it is
            available
        '401':
          description: wrong OTP code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: wrong password or invalid email
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/v1/accounts/{account_uid}/me/otp":
    parameters:
    - name: account_uid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Start setting up an authenticator app or hardware token
      tags:
      - Me
      security:
      - BearerAuth: []
      responses:
        '201':
          description: secret and QR code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MfaEnrollment"
        '422':
          description: unknown fields, such as choosing a method
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: MFA is already turned on
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    delete:
      summary: Turn off MFA
      tags:
      - Me
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 32
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 128
              type: object
              unevaluatedProperties: false
              required:
              - code
              - current_password
              additionalProperties: false
      responses:
        '204':
          description: MFA turned off
        '403':
          description: the account requires MFA
          content:
            application/json:
              schema:
