          enum:
          - owner
          - admin
          - member
        status:
          type: string
          enum:
          - active
          - disabled
        email_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        last_sign_in_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        password_changed_at:
          type: string
          format: date-time
        otp_method:
          type: string
          enum:
          - totp
          - hotp
          description: The method used when setting up MFA.
        account:
          "$ref": "#/components/schemas/Account"
      title: Me
    MfaEnrollment:
      type: object
      required:
      - otp_type
      - digits
      - secret
      - provisioning_uri
      - qr_code_svg
      properties:
        otp_type:
          type: string
          enum:
          - totp
          - hotp
        digits:
          type: integer
          minimum: 6
          maximum: 10
        step_seconds:
          type:
          - integer
          - 'null'
          description: TOTP only.
        secret:
          type: string
          description: Base32 secret for manual entry.
        provisioning_uri:
          type: string
          description: otpauth:// URI.
        qr_code_svg:
          type: string
          description: The provisioning URI as an SVG QR code.
      title: MfaEnrollment
    Project:
      type: object
      required:
      - uid
      - name
      - allow_self_sign_up
      - token_issuer
      - created_at
      - updated_at
      properties:
        uid:
          type: string
          example: proj_9Fk2Lm8Qw3Rt7Yx5Vb1Nc4D
        name:
          type: string
        allow_self_sign_up:
          type: boolean
        confirm_sign_up_url:
          type:
          - string
          - 'null'
          description: https URL with {token}, used for links in end-user emails.
        reset_password_url:
          type:
          - string
          - 'null'
          description: https URL with {token}, used for links in end-user emails.
        accept_invitation_url:
          type:
          - string
          - 'null'
          description: https URL with {token}, used for links in end-user emails.
        token_issuer:
          type: string
          description: The `iss` of tokens issued to the project's end users.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      title: Project
    ProjectMember:
      type: object
      required:
      - user_uid
      - name
      - email
      - role
      - created_at
      properties:
        user_uid:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - admin
          - developer
          - viewer
        created_at:
          type: string
          format: date-time
      title: ProjectMember
    RecoveryCodes:
      type: object
      required:
      - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          minItems: 10
          maxItems: 10
      title: RecoveryCodes
    SamlApp:
      type: object
      required:
      - uid
      - name
      - enabled
      - entity_id
      - acs_urls
      - slo_url
      - sp_certificate
      - name_id_format
      - attribute_mappings
      - sign_assertion
      - sign_response
      - require_signed_requests
      - default_relay_state
      - launch_url
      - created_at
      - updated_at
      properties:
        uid:
          type: string
          example: saml_9Lq3Wm7Xc2Vb8Nz4Rt6Kj5Hd
        name:
          type: string
        enabled:
          type: boolean
        entity_id:
          type: string
        acs_urls:
          type: array
          items:
            type: string
        slo_url:
          type:
          - string
          - 'null'
        sp_certificate:
          type:
          - string
          - 'null'
        name_id_format:
          type: string
          enum:
          - email
          - persistent
          - unspecified
        attribute_mappings:
          type: array
          items:
            type: object
            required:
            - name
            - source
            properties:
              name:
                type: string
              source:
                type: string
        sign_assertion:
          type: boolean
        sign_response:
          type: boolean
        require_signed_requests:
          type: boolean
        default_relay_state:
          type:
          - string
          - 'null'
        launch_url:
          type: string
          description: Starts an IdP-initiated sign-in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      title: SamlApp
    SamlIdentityProvider:
      type: object
      required:
      - entity_id
      - metadata_url
      - sso_url
      - slo_url
      - certificates
      properties:
        entity_id:
          type: string
        metadata_url:
          type: string
        sso_url:
          type: string
        slo_url:
          type: string
        certificates:
          type: array
          items:
            type: object
            required:
            - uid
            - status
            - certificate
            - fingerprint_sha256
            - activated_at
            - expires_at
            - created_at
            properties:
              uid:
                type: string
              status:
                type: string
                enum:
                - next
                - active
                - retired
              certificate:
                type: string
                description: PEM.
              fingerprint_sha256:
                type: string
              activated_at:
                type:
                - string
                - 'null'
                format: date-time
              expires_at:
                type: string
                format: date-time
              created_at:
                type: string
                format: date-time
      title: SamlIdentityProvider
    SignInChallenge:
      type: object
      required:
      - challenge
      - session
      properties:
        challenge:
          type: string
          enum:
          - otp
          - new_password
          - mfa_setup
        session:
          type: string
          description: Pass to respond-to-challenge. Expires after 5 minutes.
        recovery_codes:
          type: array
          items:
            type: string
          description: Only after completing MFA setup.
      title: SignInChallenge
    SignInResult:
      oneOf:
      - "$ref": "#/components/schemas/TokenSet"
      - "$ref": "#/components/schemas/SignInChallenge"
      title: SignInResult
    TokenSet:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: JWT. Verify with the issuer's JWKS.
        id_token:
          type: string
          description: 'End users only: a JWT with profile claims, for the app client.'
        refresh_token:
          type: string
          description: Single use. Every refresh returns a new one.
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        recovery_codes:
          type: array
          items:
            type: string
          description: Only after completing MFA setup.
      title: TokenSet
    User:
      type: object
      required:
      - uid
      - name
      - email
      - role
      - status
      - email_verified
      - mfa_enabled
      - created_at
      - updated_at
      properties:
        uid:
          type: string
          example: usr_3Kd9Wq2LmP7xR5tN8vB4cZ6h
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - owner
          - admin
          - member
        status:
          type: string
          enum:
          - active
          - disabled
        email_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        last_sign_in_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      title: User
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    SchemaValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: array
                items:
                  type: string
            required:
            - error
            - details
