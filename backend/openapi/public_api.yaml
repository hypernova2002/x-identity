            schema:
              properties:
                acs_urls:
                  type: array
                  items:
                    type: string
                    maxLength: 2048
                  minItems: 1
                  maxItems: 10
                attribute_mappings:
                  type: array
                  items:
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                      source:
                        type: string
