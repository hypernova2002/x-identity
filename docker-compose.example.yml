name: x-identity

x-backend: &backend
  build:
    context: ./backend
    target: development
  image: x-identity-backend:development
  volumes:
    - ./backend:/rails
  environment: &backend-env
    DATABASE_HOST: db
    DATABASE_USERNAME: x_identity
    DATABASE_PASSWORD: x_identity
    REDIS_URL: redis://redis:6379/0
    CORS_ALLOWED_ORIGINS: http://localhost:5173
    SMTP_ADDRESS: mailpit
    SMTP_PORT: "1025"
    APP_BASE_URL: http://localhost:3000
    CONSOLE_BASE_URL: http://localhost:5173
    # Customers point their custom domains (CNAME) here.
    CUSTOM_DOMAIN_TARGET: domains.x-identity.localhost
    # The edge service's port, for *.localhost custom domains in development.
    CUSTOM_DOMAIN_LOCAL_PORT: "8080"
    MAIL_FROM: "x-identity <no-reply@x-identity.localhost>"
    # Development-only keys. Generate new ones (bin/rails db:encryption:init) for any other environment.
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: b31a5e01f80d018c57b4ef1864942804
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: 7f06756960cf99d86bd5f6f3f0e6873d
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: 7015699e05c7a681750fedecdfa0c7b6
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  backend:
    <<: *backend
    command: ["sh", "-c", "rm -f tmp/pids/server.pid && ./bin/rails db:prepare && ./bin/rails server -b 0.0.0.0 -p 3000"]
    ports:
      - "3000:3000"

  # Runs background jobs (emails, new-device checks, project purges) and scheduled jobs.
  worker:
    <<: *backend
    command: ["./bin/jobs"]
    depends_on:
      backend:
        condition: service_started

  web:
    build:
      context: ./web
      target: development
    image: x-identity-web:development
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_CONSOLE_URL: http://localhost:5173
    ports:
      - "5173:5173"

  # Browser tests against a mocked API, run on demand: docker compose run --rm --no-deps e2e
  e2e:
    build:
      context: ./web
      target: e2e
    image: x-identity-web:e2e
    profiles: ["e2e"]
    ipc: host
    volumes:
      - ./web:/app
      - /app/node_modules

  # Development only: serves *.localhost custom domains (e.g. http://login.acme.localhost:8080),
  # sending each project's endpoints to the backend and its hosted pages to the web app.
  edge:
    image: caddy:2.8.4-alpine
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - web
    ports:
      - "8080:80"

  yard:
    <<: *backend
    command: ["bundle", "exec", "yard", "server", "--reload", "--bind", "0.0.0.0", "--port", "8808"]
    depends_on: []
    ports:
      - "8808:8808"

  examples:
    image: nginx:1.27-alpine
    volumes:
      - ./examples/oidc-app:/usr/share/nginx/html:ro
      - ./examples/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5190:5190"
      - "5191:5191"

  # A SAML service provider for trying SAML apps (examples/saml-sp), on the backend image.
  saml-sp:
    image: x-identity-backend:development
    command: ["bundle", "exec", "puma", "-b", "tcp://0.0.0.0:5192", "/examples/saml-sp/config.ru"]
    volumes:
      - ./backend:/rails
      - ./examples/saml-sp:/examples/saml-sp:ro
    environment:
      SP_BASE_URL: http://localhost:5192
      # The project's SAML metadata, as this container reaches the backend; see docs/examples.md.
      IDP_METADATA_URL: ""
    depends_on:
      - backend
    ports:
      - "5192:5192"

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: x_identity
      POSTGRES_PASSWORD: x_identity
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  db-data:
  redis-data:
