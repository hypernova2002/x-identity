# Serves the same static OIDC example app on two ports (two origins), so each copy has its own
# storage and app client, and single sign-on between them goes through x-identity.
server {
  listen 5190;
  listen 5191;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store";

  location / {
    try_files $uri /index.html;
  }
}
